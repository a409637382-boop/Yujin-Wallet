name: Build Yujin DAppBridge AAR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: 解压工程并校验 SDK
        run: |
          set -e
          unzip -q "Yujin-DAppBridge_GitHub编译专用包.zip" -d work
          test -s "work/native-plugin-src/Yujin-DAppBridge/android/libs/uniapp-v8-release.aar"
          unzip -tq "work/native-plugin-src/Yujin-DAppBridge/android/libs/uniapp-v8-release.aar"

      - name: 设置 JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 安装 Android SDK 编译组件
        run: |
          set -e
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: 设置 Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: 编译 release AAR
        run: |
          set -e
          gradle -p "work/native-plugin-src/Yujin-DAppBridge/android" \
            --no-daemon clean extractDcloudCompileJars assembleRelease

      - name: 检查并打包 HBuilderX 插件
        run: |
          set -e
          SRC="work/native-plugin-src/Yujin-DAppBridge"
          OUT="dist/Yujin-DAppBridge/android"

          mkdir -p "$OUT"

          cp "$SRC/package.json" "dist/Yujin-DAppBridge/package.json"

          AAR=$(find "$SRC/android/build/outputs/aar" \
            -name "*-release.aar" -type f | head -1)

          test -n "$AAR"
          test -s "$AAR"
          unzip -tq "$AAR"

          cp "$AAR" "$OUT/Yujin-DAppBridge-release.aar"

          (cd dist && zip -qr Yujin-DAppBridge-HBuilderX.zip Yujin-DAppBridge)

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: Yujin-DAppBridge-AAR
          path: |
            work/native-plugin-src/Yujin-DAppBridge/android/build/outputs/aar/*.aar
            dist/Yujin-DAppBridge-HBuilderX.zip
          if-no-files-found: error
